apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: keycloakgrouprolemappings.keycloak.clouddicted.com
spec:
  group: keycloak.clouddicted.com
  scope: Namespaced
  names:
    kind: KeycloakGroupRoleMapping
    plural: keycloakgrouprolemappings
    singular: keycloakgrouprolemapping
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Group
          type: string
          jsonPath: .spec.groupRef.name
        - name: Role Type
          type: string
          jsonPath: .spec.role.type
        - name: Role
          type: string
          jsonPath: .spec.role.roleRef.name
        - name: Realm
          type: string
          jsonPath: .spec.realm
        - name: Target
          type: string
          jsonPath: .spec.targetRef.name
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: Desired Keycloak group role assignment.
              required:
                - targetRef
                - realm
                - groupRef
                - role
              properties:
                targetRef:
                  type: object
                  description: KeycloakTarget used to reach Keycloak.
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      description: Name of the KeycloakTarget in this namespace.
                      minLength: 1
                realm:
                  type: string
                  description: Realm containing the group and role.
                  minLength: 1
                groupRef:
                  type: object
                  description: KeycloakGroup receiving the role assignment.
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      description: Name of the KeycloakGroup in this namespace.
                      minLength: 1
                role:
                  type: object
                  description: Role assigned to the group.
                  required:
                    - type
                    - roleRef
                  properties:
                    type:
                      type: string
                      description: Role mapping type.
                      enum:
                        - RealmRole
                        - ClientRole
                    roleRef:
                      type: object
                      description: Role assigned to the group.
                      required:
                        - name
                      properties:
                        name:
                          type: string
                          description: Name of the KeycloakRole or KeycloakClientRole.
                          minLength: 1
                    clientRef:
                      type: object
                      description: Client owning the role when type is ClientRole.
                      required:
                        - name
                      properties:
                        name:
                          type: string
                          description: Name of the KeycloakClient in this namespace.
                          minLength: 1
                managementPolicy:
                  type: string
                  description:
                    Reconciliation behavior for the remote Keycloak group role
                    assignment. Reconcile assigns the role when missing;
                    ObserveOnly reports a missing assignment without changing
                    Keycloak.
                  default: Reconcile
                  enum:
                    - Reconcile
                    - ObserveOnly
                deletionPolicy:
                  type: string
                  description:
                    Deletion behavior for the remote Keycloak group role
                    assignment when this resource is deleted. Orphan leaves the
                    assignment in Keycloak; Delete removes only this declared
                    assignment.
                  default: Orphan
                  enum:
                    - Orphan
                    - Delete
            status:
              type: object
              description: Observed KeycloakGroupRoleMapping status.
              properties:
                groupRemoteId:
                  type: string
                  description: Keycloak internal ID of the observed group.
                roleRemoteId:
                  type: string
                  description: Keycloak internal ID of the observed role.
                clientRemoteId:
                  type: string
                  description: Keycloak internal ID of the observed client role owner.
                conditions:
                  type: array
                  description: Current Kubernetes-style status conditions.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                        description: Condition type.
                        minLength: 1
                      status:
                        type: string
                        description: Condition status.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      observedGeneration:
                        type: integer
                        description: Resource generation observed by the operator.
                        format: int64
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        description: Time when the condition last changed.
                        format: date-time
                      reason:
                        type: string
                        description: Short reason for the condition state.
                        minLength: 1
                      message:
                        type: string
                        description: Human-readable condition details.
